[package]
name = "qwen-hybrid"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "RTX 5090 pipeline stage (layers 28-47) for Qwen3.8-Flash-Next Sushi packs"

[[bin]]
name = "canon-stage-server"
path = "src/bin/canon_stage_server.rs"
required-features = ["cuda", "metal"]

[features]
default = []
metal = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-metal"]
cuda = []
r45-driver = ["cuda"]
r53-driver = ["cuda"]

[dependencies]
anyhow = "1"
half = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3.2", optional = true }
objc2-metal = { version = "0.3.2", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1

